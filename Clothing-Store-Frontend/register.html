<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | 3WRLD</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html">3WRLD</a>
      <nav>
        <a href="shop.html">Shop</a><a href="account.html">Account</a
        ><a href="cart.html">Cart</a>
      </nav>
    </header>
    <main>
      <section class="auth-wrap">
        <form id="register-form" class="auth-card">
          <h1>Create Account</h1>
          <label>Username<input class="input" name="username" required /></label
          ><label
            >Email<input
              class="input"
              name="email"
              type="email"
              required /></label
          ><label>First name<input class="input" name="first_name" /></label
          ><label>Last name<input class="input" name="last_name" /></label
          ><label
            >Password<input
              class="input"
              name="password"
              type="password"
              required /></label
          ><button class="btn">Register</button>
          <p id="auth-message"></p>
        </form>
      </section>
    </main>
    <footer>
      <strong>3WRLD</strong>
      <p>© 2026 3WRLD</p>
    </footer>
    <script src="js/config.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
